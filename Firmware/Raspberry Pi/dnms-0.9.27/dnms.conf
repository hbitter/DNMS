#
# ********* Configuration file for DNMS raspi program *********
#
# ********* some specific parameters for the Raspberry Pi, be carefull with changes *********
#
# ********* true and false values are now represented by 0 and 1
#
# waiting time after program start - this depends on the raspi type
# for Pi Zero W should be 20 seconds, for Pi Zero 2W 10 seconds
waiting_time_after_start = 10;
#
# Priorities for threads
prio_1st_timer = 8;
prio_1st_measurement = 7;
prio_2nd_timer = 6;
prio_2nd_measurement = 5;
prio_wlan = 4;
prio_print_ipc_and_log_1st = 1;
prio_print_ipc_and_log_2nd = 1;
prio_start_stop = 2;
#
# name of I²C device on Raspi for I²C connection to DNMS
dev_name_dnms = "/dev/i2c-1";
#
#
# name of wlan or lan interface for transmission of data to Sensor.Community and/or other APIs
interface_name = "wlan0";
#
enable_wlan_or_lan = true;
#
# Include WiFi signal strength (RSSI) in payload — configurable per channel
# Note: Madavi always receives signal when enabled (no separate switch)
enable_wifi_signal_strength_influxdb = true;
enable_wifi_signal_strength_mqtt = true;
#
# Include last transmission duration (ms) in InfluxDB and MQTT payloads
last_influxdb_transmission_time_to_payload = true;
last_mqtt_transmission_time_to_payload = true;
#
#
# ********* short or long ID  ********* 
# the id is generated from the MAC address, short means that it is genearted fron the 3 lower MAC bytes, 
# long means from all 6 MAC bytes
# short is the default, that was used up to the version before 0.9.22
# if you choose long and the Raspiberry Pi was registered to Sensor.Community before with a short ID, it has to be registered 
# again with the new long ID
# long_id = false means short ID as before and long_id = true means generate a long ID based on all 6 MAC bytes
long_id = true;
#
# ********* Configuration of connected microphone  -- ICS-43434  or IM72D128  ********* 
# dnms_microphone = 1 is "ICS-43434";
# dnms_microphone = 2 is "IM72D128";
# dnms_microphone = 3 is "IM72D128_with_DLR_case"
# dnms_microphone = 4 is "ICS-43434_no_correction"
# dnms_microphone = 5 is "IM72D128_no_correction"
# dnms_microphone = 6 is "micro_3"  (custom — fill in calib_micro3 and DNMS_MICRO_CONST_MICRO3 in dnms_calib_data.h)
# dnms_microphone = 7 is "micro_4"  (custom — fill in calib_micro4 and DNMS_MICRO_CONST_MICRO4 in dnms_calib_data.h)
dnms_microphone = 2;
#
# ********* LED blink period in ms per microphone type — transmitted to Teensy at startup *********
# Adjust each value to visually distinguish the active microphone.
# Default values are shown; missing entries keep the default.
dnms_blink_period_1 = 100;    # ICS-43434
dnms_blink_period_2 = 500;    # IM72D128
dnms_blink_period_3 = 500;    # IM72D128 with DLR case
dnms_blink_period_4 = 100;    # ICS-43434 no correction
dnms_blink_period_5 = 500;    # IM72D128 no correction
dnms_blink_period_6 = 200;    # micro_3
dnms_blink_period_7 = 1000;   # micro_4
#
# ********* Microphone sensitivity constant (dB) per microphone type — transmitted to Teensy at startup *********
# This constant is added to 10*log10(mean_power) to produce the final Leq in dB SPL.
# Missing entries keep the default shown here.
dnms_micro_const_1 = 123.0102999565;   # ICS-43434
dnms_micro_const_2 = 133.0102999565;   # IM72D128
dnms_micro_const_3 = 133.0102999565;   # IM72D128 with DLR case
dnms_micro_const_4 = 123.0102999565;   # ICS-43434 no correction
dnms_micro_const_5 = 133.0102999565;   # IM72D128 no correction
dnms_micro_const_6 = 0.0;              # micro_3 — fill in actual value
dnms_micro_const_7 = 0.0;              # micro_4 — fill in actual value
#
#
# ********* Correction value in dB(A) for microphone  -- for ICS-43434  or IM72D128  ********* 
#
dnms_correction = 0.0;
#
# ********* Configuration of 1st and 2nd measurement interval - enable/disable and Interval times  ********* 
#
# 1st interval enable or disable
enable_1st_interval = true;
#
# 1st measurement interval, in ms
measurement_1st_interval_ms = 150000;
#
# 2nd interval enable or disable
enable_2nd_interval = false;
#
# 2nd measurement interval, in ms
measurement_2nd_interval_ms = 2000;
#
# threshold for transmission of 2nd interval measurements to influxdb, transmission to influxdb is started if LAeq is equal or higher than threshold
threshold_2nd_interval_laeq_transmit = 60;
#
# number of transmissions of 2nd interval measurement after exceeding threshold
number_transmissions_after_exceeding = 100;
#
# switch output pin, if threshold of 2nd is exceeded, true or false
switch_output_pin = false;
#
# pin that is switched on/off based on Broadcom GPIO numbering
gpio_output_pin = 17;
#
# start on the full minute (seconds = 00)
start_on_full_minute = false;
#
# start on the full hour (minutes = 00 and seconds = 00)
start_on_full_hour = false;
#
#
#
#  ********* Transmission to InfluxDB and/or MQTT Broker -  what data is transferred to InfluxDB and/or MQTT Broker  ********* 
#
# 1st measurement interval LAeq data to influxDB, true or false
data_transmit_laeq_1st_to_influxdb = true;
#
# 1st measurement interval LZeq data to influxDB, true or false
data_transmit_lzeq_1st_to_influxdb = true;
#
# 1st measurement interval LCeq data to influxDB, true or false
data_transmit_lceq_1st_to_influxdb = true;
#
# 1st measurement interval LAeq spectrum data to influxDB, true or false
data_transmit_laeq_1st_spectrum_to_influxdb = true;
#
# 1st measurement interval LZeq spectrum data to influxDB, true or false
data_transmit_lzeq_1st_spectrum_to_influxdb = true;
#
# 1st measurement interval LCeq spectrum data to influxDB, true or false
data_transmit_lceq_1st_spectrum_to_influxdb = true;
#
# 2nd measurement interval LAeq data to influxDB, true or false
data_transmit_laeq_2nd_to_influxdb = true;
#
# 2nd measurement interval LZeq data to influxDB, true or false
data_transmit_lzeq_2nd_to_influxdb = true;
#
# 2nd measurement interval LCeq data to influxDB, true or false
data_transmit_lceq_2nd_to_influxdb = true;
#
# 2nd measurement interval LAeq spectrum data to influxDB, true or false
data_transmit_laeq_2nd_spectrum_to_influxdb = true;
#
# 2nd measurement interval LZeq spectrum data to influxDB, true or false
data_transmit_lzeq_2nd_spectrum_to_influxdb = true;
#
# 2nd measurement interval LCeq spectrum data to influxDB, true or false
data_transmit_lceq_2nd_spectrum_to_influxdb = true;
#
# send timestamp to InfluxDB, true or fase
timestamp_to_influxdb = true;
#
#
#
#  ********* Further configuration options for transmission to an InfluxDB  ********* 
#
# data transmission to influxDB as http, true or false (false means no http transmission)
influxdb_transmit_http = false;
#
# data transmission to InfluxDB as https, true or false (false means http)
influxdb_transmit_https = false;
#
# InfluxDB server address
influxdb_server = "url or ip";
#
# InfluxDB server port
influxdb_port = "port #";
#
# InfluxDB user name
influxdb_user = "user";
#
# InfluxDB passwort for user
influxdb_passwort = "password of user";
#
# InfluxDB database path and name (or bucket for InfluxDB V2), this is also necessary if transmission to InfluxDB is via MQTT Broker
influxdb_pfad = "/write?db=dnms";
#
# InfluxDB measurement name, this is also necessary if transmission to InfluxDB is via MQTT Broker
influxdb_messung = "dnms";
#
#
#
# *********  Configuration for transmission to an MQTT Broker  ********* 
#
# data transmission to MQTT Broker, InfluxDB Line Protocol is used, true or false (false means no MQTT transmission)
mqtt_transmit = true;
#
# MQTT user name
mqtt_user = "user";
#
# MQTT passwort for user
mqtt_passwort = "password";
#
# MQTT Broker server address
mqtt_broker = "URL or IP";
#
# MQTT Broker server port
mqtt_port = 1883;
#
# MQTT TLS/SSL: enable encrypted connection (true or false)
mqtt_use_tls = false;
#
# Path to CA certificate file for server verification
# Leave empty to use system default (/etc/ssl/certs); set to "" when mqtt_tls_insecure = true
mqtt_tls_cafile = "";
#
# Skip hostname verification — only for self-signed certs in trusted networks (true or false)
mqtt_tls_insecure = false;
#
# MQTT keepalive time
mqtt_keepalive = 60;
#
# MQTT QoS
mqtt_qos = 0;
#
# MQTT Main Topic
mqtt_main_topic = "sensoren/dnms";
#
# use Raspberry-ID as Sub Tpoic
mqtt_use_id_as_sub_topic = true;
#
# Name of measurement in InfluxDB Line Protocol
mqtt_messung = "dnms";
#
# Configuration of which data should be transmitted to the MQTT Broker
data_transmit_laeq_1st_to_mqtt = true;
data_transmit_lzeq_1st_to_mqtt = true;
data_transmit_lceq_1st_to_mqtt = true;
data_transmit_laeq_1st_spectrum_to_mqtt = true;
data_transmit_lzeq_1st_spectrum_to_mqtt = true;
data_transmit_lceq_1st_spectrum_to_mqtt = true;
data_transmit_laeq_2nd_to_mqtt = true;
data_transmit_lzeq_2nd_to_mqtt = true;
data_transmit_lceq_2nd_to_mqtt = true;
data_transmit_laeq_2nd_spectrum_to_mqtt = true;
data_transmit_lzeq_2nd_spectrum_to_mqtt = true;
data_transmit_lceq_2nd_spectrum_to_mqtt = true;



#
# ********* Configuration options for transmission to Sensor.Community ********* 
#
# transmission of LAeq 1st interval to Sensor.Community, true or false
data_transmit_laeq_to_sc = false;
#
# Host Sensor.Community
host_sc = "api.sensor.community";
#
# Port Sensor.Community and http or https  -- Attention: At the moment https is not working, you have to use http
port_sc = "http";
#
# URL to data store of Sensor.Community
url_sc = "/v1/push-sensor-data/";
#
# API PIN für DNMS at Sensor.Community
DNMS_API_PIN = "15";
#
# use http or https for transmission to Sensor.Community, must be inline with port_sc and: At them moment https is not working, 
# you have to use http, true or false
sc_transmit_https = false;
#
# should LAeq be transmitted to Madavi as well
data_transmit_laeq_to_madavi = false;
#
#
#
#
# ********* Configuration options for IPC - Inter Process Communication  using a named pipe ********* 
#
data_transmit_via_pipe = false;
#
# Name of pipe ***  important: input the absolut path to the pipe !!
name_of_pipe ="/home/helmut/dnms/dnms_pipe"; 
#
#
#
#  ********* start/stop measurement from named pipe message  ********* 
# 
# name of named pipe for start/stop. The named pipe should be placed in the /tmp directory - not in a user directory, which will not work!
start_stop_name_of_pipe = "/tmp/start_stop_dnms";
#
start_stop_extern = false;
#
#
#
# ********* Date / time output format *********
#
# Date and time display format: true = ISO (YYYY-MM-DD HH:MM:SS), false = German (DD.MM.YYYY HH:MM:SS)
date_format_iso = false;
#
#
# ********* Configuration if measurement values output on terminal   *********
#
# shall measurement values be outputted on terminal, true od false
data_on_terminal = false;
#
#
# ********* Configuration which measurement values output on terminal output, named pipe transmission and/or data logging  ********* 
#
# output of  LAeq 1st interval measurements values on terminal, true or false
data_laeq_1st_output_on_terminal = true;
#
# output of  LA spectrum 1st interval measurements values on terminal, true or false
data_la_spec_1st_output_on_terminal = false;
#
# output of  LZeq 1st interval measurements values on terminal, true or false
data_lzeq_1st_output_on_terminal = false;
#
# output of  LZ spectrum 1st interval measurements values on terminal, true or false
data_lz_spec_1st_output_on_terminal = false;
#
# output of  LCeq 1st interval measurements values on terminal, true or false
data_lceq_1st_output_on_terminal = false;
#
# output of  LC spectrum 1st interval measurements values on terminal, true or false
data_lc_spec_1st_output_on_terminal = false;
#
# output of LAeq 2nd interval measurements values on terminal, true or false
data_laeq_2nd_output_on_terminal = false;
#
# output of LA spectrum 2nd interval measurements values on terminal, true or false
data_la_spec_2nd_output_on_terminal = false;
#
# output of LZeq 2nd interval measurements values on terminal, true or false
data_lzeq_2nd_output_on_terminal = false;
#
# output of LZ spectrum 2nd interval measurements values on terminal, true or false
data_lz_spec_2nd_output_on_terminal = false;
#
# output of LCeq 2nd interval measurements values on terminal, true or false
data_lceq_2nd_output_on_terminal = false;
#
# output of LC spectrum 2nd interval measurements values on terminal, true or false
data_lc_spec_2nd_output_on_terminal = false;
#
#
#
# ********* Configuration of additional information output to terminal *********
#
# output to terminal of last transmission time to influxdb, true or false
last_influxdb_transmission_time_to_terminal = true;
#
# threshold to output the last transmission time to InfluxDB to terminal if transmission time is higher than threshold, in ms
threshold_output_influxdb_ltt_to_terminal = 100;
#
# output to terminal of last transmission time to MQTT Broker, true or false
last_mqtt_transmission_time_to_terminal = true;
#
# threshold to output the last transmission time to MQTT Broker to terminal if transmission time is higher than threshold, in ms
threshold_output_mqtt_ltt_to_terminal = 5;
#
# output to terminal of last transmission time to Sensor.Community, true or false
last_sc_transmission_time_to_terminal = true;
#
# threshold time to output last transmission time to Sensor.Community to terminal if transmission time is higher than threshold, in ms
threshold_output_sc_ltt_to_terminal = 300;
#
# output thread information at program start, true or false
output_thread_info = false;
#
#
#
# ********* data logging functionality *********
#
# enable/diasable data logging functionality
data_logging = false;
#
# directory for data logging (full path)
data_logging_directory = "/home/helmut/dnms/dnms_logging";
#
# ── Environment sensors ──────────────────────────────────────────────────────
# All sensors are disabled by default.
# Sensors are read only when measurement_1st_interval_ms > 29000 (interval > 29 s).
# SPS30 and SEN5x share I2C address 0x69 — enable only one at a time.
#
# SDS011 — Nova PM UART sensor (PM2.5 + PM10)
enable_sds011 = false;
sds011_uart_port = "/dev/ttyUSB0";
#
# SPS30 — Sensirion I2C PM sensor (PM mass + number concentrations)
enable_sps30 = false;
#
# SHT3x — Sensirion I2C temperature + humidity
enable_sht3x = false;
# SHT3x I2C address: 68 (0x44, ADDR=GND, default) or 69 (0x45, ADDR=VDD)
# Falls back to the other address automatically if the configured one is not found.
sht3x_i2c_addr = 68;
temp_correction_sht3x = 0.0;
#
# SEN5x — Sensirion I2C PM + temperature + humidity + VOC + NOx
enable_sen5x = false;
temp_correction_sen5x = 0.0;
#
# BME280 — Bosch I2C temperature + pressure + humidity (also supports BMP280)
enable_bme280 = false;
# BME280 I2C address: 118 (0x76, SDO=GND, default) or 119 (0x77, SDO=VDD)
# Falls back to the other address automatically if the configured one is not found.
bme280_i2c_addr = 118;
temp_correction_bme280 = 0.0;
#
# end

